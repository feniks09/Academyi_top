<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ apartment.name }} - Годы</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .breadcrumbs { font-size: 14px; color: #7f8c8d; margin-bottom: 15px; }
        .breadcrumbs a { color: #3498db; text-decoration: none; }
        .list-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .list-table td { padding: 15px; border-bottom: 1px solid #eee; }
        .list-table tr:hover { background: #f8fafc; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="breadcrumbs">
            <a href="{% url 'dashboard' %}">Личный кабинет</a> / <span>{{ apartment.name }}</span>
        </div>
        <h2>{{ apartment.name }}</h2>
        <p style="color: #7f8c8d;">Выберите год для просмотра платежей</p>
        
        <table class="list-table">
            {% for y in years %}
            <tr onclick="window.location='{% url 'apartment_months' apartment.id y %}'">
                <td><b>{{ y }} год</b></td>
                <td style="text-align: right; color: #3498db;">Перейти →</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
