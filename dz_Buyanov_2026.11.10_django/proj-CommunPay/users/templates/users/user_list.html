<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Пользователи</title></head>
<body>
    <h1>Пользователи</h1>
    <table border="1">
        <tr><th>Email</th><th>Имя</th><th>Город</th><th>Статус</th></tr>
        {% for u in users %}
        <tr>
            <td>{{ u.email }}</td>
            <td>{{ u.first_name }} {{ u.last_name }}</td>
            <td>{{ u.profile.city|default:"—" }}</td>
            <td>{% if u.is_staff %}Админ{% else %}Пользователь{% endif %}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
