services:
  - type: web
    name: communal-payments
    runtime: docker
    plan: free
    dockerContext: ./dz_Buyanov_2026.10.27_fast_avtoriz/communal-payments
    dockerfilePath: ./dz_Buyanov_2026.10.27_fast_avtoriz/communal-payments/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: communal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120

databases:
  - name: communal-db
    databaseName: communal
    user: user
    plan: free