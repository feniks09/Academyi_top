<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Мои квартиры и платежи</title>
  <style>
    :root {
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --primary: #3498db;
      --danger: #e74c3c;
      --success: #27ae60;
      --border: #dcdde1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container { display: flex; gap: 20px; max-width: 1200px; width: 100%; }
    
    /* Левая колонка */
    .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; width: 100%; }
    /* Правая колонка */
    .sidebar { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--card-bg); border-radius: 12px; padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border);
    }

    h1, h2, h3, h4 { margin-top: 0; }
    
    /* Хлебные крошки */
    .breadcrumbs { font-size: 14px; color: var(--muted); margin-bottom: 15px; }
    .breadcrumbs span { cursor: pointer; color: var(--primary); }
    .breadcrumbs span:hover { text-decoration: underline; }
    .breadcrumbs .current { color: var(--text); font-weight: bold; cursor: default; text-decoration: none; }

    /* Формы и кнопки */
    input, select, button {
      padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
      font-size: 14px; font-family: inherit; box-sizing: border-box;
    }
    input { width: 100%; margin-bottom: 10px; }
    button {
      cursor: pointer; background: var(--primary); color: white; border: none;
      font-weight: 500; transition: 0.2s; width: 100%;
    }
    button:hover { opacity: 0.9; }
    button.btn-danger { background: var(--danger); padding: 4px 8px; font-size: 12px; width: auto; }
    button.btn-edit { background: var(--primary); padding: 4px 8px; font-size: 12px; width: auto;}
    button.btn-action { margin-top: 10px; }
    button.btn-back { background: var(--muted); margin-bottom: 15px; font-size: 13px; padding: 6px 12px; width: auto; }
    
    /* Кнопки иконки */
    .btn-icon {
      background: none; border: none; cursor: pointer; font-size: 16px;
      padding: 2px 6px; color: var(--muted); transition: 0.2s; width: auto;
    }
    .btn-icon:hover { color: var(--text); }
    .btn-icon.delete:hover { color: var(--danger); }
    .btn-icon.edit:hover { color: var(--primary); }

    /* Вкладки входа */
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .auth-tab {
      padding: 10px 20px; cursor: pointer; color: var(--muted); font-weight: 500;
      border-bottom: 2px solid transparent; background: none; border-radius: 0; width: auto;
    }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .auth-tab:hover { color: var(--text); }

    /* Таблицы */
    .list-table { width: 100%; border-collapse: collapse; }
    .list-table th, .list-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    .list-table th { color: var(--muted); font-weight: 500; font-size: 13px; text-transform: uppercase; }
    
    .clickable-row { cursor: pointer; transition: background 0.2s; }
    .clickable-row:hover { background: #f8fafc; }
    
    .disabled-row { background-color: #f9f9f9; cursor: not-allowed; opacity: 0.6; }
    .disabled-row:hover { background-color: #f9f9f9; }
    
    .debt-text { color: var(--danger); font-weight: bold; }
    .debt-zero { color: var(--success); font-weight: bold; }

    /* Статусы */
    .status-paid { color: var(--success); font-weight: bold; }
    .status-partial { color: #f39c12; font-weight: bold; }
    .status-unpaid { color: var(--danger); font-weight: bold; }

    .hidden { display: none !important; }
    #login-view { max-width: 400px; width: 100%; margin-top: 50px; }
    
    .empty-msg { text-align: center; color: var(--muted); padding: 20px; }

    /* Заголовки на страницах */
    .page-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .header-title-group {
      display: flex; align-items: baseline; gap: 15px;
    }
    .current-month-badge {
      background: #e1f0fa; color: var(--primary); padding: 4px 10px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }

    /* Выпадающая форма */
    .add-form-container { margin-bottom: 20px; text-align: right; }
    .form-hidden { display: none; text-align: left; background: #eef2f5; padding: 15px; border-radius: 8px; margin-top: 10px;}
  </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login-view" class="card">
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
    <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
  </div>

  <form id="login-form">
    <input name="username" placeholder="Логин" required>
    <input name="password" type="password" placeholder="Пароль" required>
    <button type="submit" class="btn-action">Войти</button>
  </form>

  <form id="register-form" class="hidden">
    <input name="username" placeholder="Придумайте логин" required>
    <input name="password" type="password" placeholder="Придумайте пароль" required>
    <button type="submit" class="btn-action">Зарегистрироваться</button>
  </form>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="app-view" class="container hidden">
  
  <!-- ЛЕВАЯ ЧАСТЬ -->
  <div class="main-content" id="main-content-area">
    <div class="card">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div id="content-area"></div>
    </div>
  </div>

  <!-- ПРАВАЯ ЧАСТЬ (Личный кабинет на главной) -->
  <div class="sidebar" id="sidebar-area">
    <div class="card">
      <h3>Личный кабинет</h3>
      <button id="logout" style="background: var(--muted); margin-bottom: 15px;">Выйти</button>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
      <h4>Добавить объект</h4>
      <form id="apartment-form">
        <input name="name" placeholder="Название (Кв. 12)" required>
        <input name="description" placeholder="Адрес" required>
        <input name="epd_code" placeholder="Код ЕПД (не обяз.)">
        <button type="submit" class="btn-action">Добавить квартиру</button>
      </form>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const token = () => localStorage.getItem("token");

let currentApartments = [];
let allPayments = [];

let currentView = 'dashboard'; 
let selectedAptId = null;
let selectedYear = null;
let selectedMonth = null;
let editingPaymentId = null;

const MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const SERVICES_LIST = [
  { val: "water", label: "ХВС КПУ" },
  { val: "water_drain", label: "Водоотв. КПУ" },
  { val: "capital_repair", label: "Взнос на кап. ремонт" },
  { val: "maintenance", label: "Сод.жил.пом. и ТКО" },
  { val: "concierge", label: "Консьержка" },
  { val: "penalty", label: "Пени" }
];

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token()) headers.Authorization = `Bearer ${token()}`;
  const res = await fetch(path, { ...options, headers });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

function getCurrentBillingMonth() {
  const today = new Date();
  let m = today.getMonth() + 1; // 0-indexed
  let y = today.getFullYear();
  if (today.getDate() < 12) {
    m -= 1;
    if (m === 0) { m = 12; y -= 1; }
  }
  return MONTH_NAMES[m - 1];
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'login') {
    $("#login-form").classList.remove("hidden");
    $("#register-form").classList.add("hidden");
  } else {
    $("#login-form").classList.add("hidden");
    $("#register-form").classList.remove("hidden");
  }
}

$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = new URLSearchParams(new FormData(e.target)).toString();
  const res = await fetch("/auth/token", {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body,
  });
  if (!res.ok) { alert("Неверный логин или пароль"); return; }
  const data = await res.json();
  localStorage.setItem("token", data.access_token);
  enterApp();
});

$("#register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const data = await api("/auth/register", { method: "POST", body: JSON.stringify(body) });
    alert("Регистрация успешна!");
    localStorage.setItem("token", data.access_token);
    enterApp();
  } catch (err) { alert(err.message); }
});

function enterApp() {
  $("#login-view").classList.add("hidden");
  $("#app-view").classList.remove("hidden");
  navigateTo('dashboard');
}

$("#logout").addEventListener("click", () => {
  localStorage.removeItem("token");
  location.reload();
});

$("#apartment-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  await api("/projects/", { method: "POST", body: JSON.stringify(fd) });
  e.target.reset();
  navigateTo('dashboard'); 
});

function navigateTo(view, aptId = null, year = null, month = null) {
  currentView = view;
  if (aptId !== null) selectedAptId = aptId;
  if (year !== null) selectedYear = year;
  if (month !== null) selectedMonth = month;

  editingPaymentId = null;

  // Прячем/Показываем сайдбар
  if (view === 'dashboard') {
    $("#sidebar-area").classList.remove("hidden");
    $("#main-content-area").style.flex = "1"; // сжимаем
  } else {
    $("#sidebar-area").classList.add("hidden");
    $("#main-content-area").style.flex = "100%"; // растягиваем
  }

  renderBreadcrumbs();
  renderContent();
}

function renderBreadcrumbs() {
  const bc = $("#breadcrumbs");
  bc.innerHTML = "";

  if (currentView === 'dashboard') {
    bc.innerHTML = `<span class="current">Мои объекты</span>`;
    return;
  }

  const apt = currentApartments.find(a => a.id === selectedAptId);
  
  // Ссылка на главную
  bc.innerHTML += `<span onclick="navigateTo('dashboard')">Личный кабинет</span> / `;

  if (currentView === 'apartment') {
    bc.innerHTML += `<span class="current">${apt.name}</span>`;
  } else if (currentView === 'year') {
    bc.innerHTML += `<span onclick="navigateTo('apartment', ${apt.id})">${apt.name}</span> / `;
    bc.innerHTML += `<span class="current">${selectedYear} год</span>`;
  } else if (currentView === 'month') {
    bc.innerHTML += `<span onclick="navigateTo('apartment', ${apt.id})">${apt.name}</span> / `;
    bc.innerHTML += `<span onclick="navigateTo('year', ${apt.id}, ${selectedYear})">${selectedYear}</span> / `;
    bc.innerHTML += `<span class="current">${MONTH_NAMES[selectedMonth - 1]}</span>`;
  }
}

async function renderContent() {
  const area = $("#content-area");
  area.innerHTML = "<p>Загрузка...</p>";

  try {
    if (currentView === 'dashboard') {
      currentApartments = await api("/projects/");
      allPayments = await api("/payments/");
      renderDashboard(area);
    } else if (currentView === 'apartment') {
      renderApartmentYears(area);
    } else if (currentView === 'year') {
      renderYearMonths(area);
    } else if (currentView === 'month') {
      renderMonthDetails(area);
    }
  } catch (err) {
    area.innerHTML = `<p style="color: var(--danger)">Ошибка: ${err.message}</p>`;
  }
}

function renderDashboard(area) {
  const debts = {};
  allPayments.forEach(p => {
    if (!debts[p.project_id]) debts[p.project_id] = 0;
    debts[p.project_id] += (p.amount_due - p.amount_paid);
  });

  const curMonth = getCurrentBillingMonth();
  
  let html = `
    <div class="page-header">
      <div class="header-title-group">
        <h2>Мои объекты</h2>
        <span class="current-month-badge">Текущий месяц: ${curMonth}</span>
      </div>
    </div>
  `;

  if (currentApartments.length === 0) {
    html += `<div class="empty-msg">У вас пока нет объектов. Добавьте квартиру справа.</div>`;
  } else {
    html += `<table class="list-table">
      <thead><tr><th>Квартира / ЕПД</th><th>Адрес</th><th>Общий долг</th><th style="text-align:right;"></th></tr></thead>
      <tbody>`;
    
    currentApartments.forEach(p => {
      const debt = debts[p.id] || 0;
      html += `
        <tr class="clickable-row" onclick="navigateTo('apartment', ${p.id})">
          <td><b>${p.name}</b><br><small style="color:var(--muted)">Код: ${p.epd_code || '-'}</small></td>
          <td style="color: var(--muted);">${p.description}</td>
          <td class="${debt > 0 ? 'debt-text' : 'debt-zero'}">${debt.toFixed(2)} ₽</td>
          <td style="text-align: right; white-space: nowrap;">
            <button class="btn-icon edit" title="Редактировать" onclick="event.stopPropagation(); alert('Редактирование квартиры в разработке')">✏️</button>
            <button class="btn-icon delete" title="Удалить" onclick="event.stopPropagation(); deleteApartment(${p.id})">❌</button>
          </td>
        </tr>
      `;
    });
    html += `</tbody></table>`;
  }
  area.innerHTML = html;
}

function renderApartmentYears(area) {
  const apt = currentApartments.find(a => a.id === selectedAptId);
  const aptPayments = allPayments.filter(p => p.project_id === selectedAptId);
  const years = [2026, 2025]; 
  
  let html = `
    <div class="page-header">
      <div class="header-title-group">
        <h2>${apt.name}</h2>
        <span style="color: var(--muted);">${apt.description}</span>
      </div>
      <div>
        <span style="color: var(--muted); font-size:14px; margin-right:10px;">Код ЕПД: <b>${apt.epd_code || 'не указан'}</b></span>
        <button onclick="navigateTo('dashboard')" style="width:auto; background:var(--muted); padding:6px 12px; font-size:13px;">← В личный кабинет</button>
      </div>
    </div>
    <p style="color: var(--muted); margin-bottom: 20px;">Выберите год для просмотра платежей</p>
  `;

  html += `<table class="list-table"><tbody>`;
  years.forEach(year => {
    const yearPayments = aptPayments.filter(p => p.year === year);
    let yearDebt = 0;
    yearPayments.forEach(p => yearDebt += (p.amount_due - p.amount_paid));
    html += `
      <tr class="clickable-row" onclick="navigateTo('year', ${apt.id}, ${year})">
        <td><b>${year} год</b></td>
        <td style="text-align:right;" class="${yearDebt > 0 ? 'debt-text' : 'debt-zero'}">Долг: ${yearDebt.toFixed(2)} ₽</td>
      </tr>
    `;
  });
  html += `</tbody></table>`;
  area.innerHTML = html;
}

function renderYearMonths(area) {
  const apt = currentApartments.find(a => a.id === selectedAptId);
  const yearPayments = allPayments.filter(p => p.project_id === selectedAptId && p.year === selectedYear);

  let html = `<h2>${apt.name} — ${selectedYear} год</h2>`;
  html += `<button class="btn-back" onclick="navigateTo('apartment', ${apt.id})">← Назад к годам</button>`;

  html += `<table class="list-table">
    <thead><tr><th>Месяц</th><th>Сумма к оплате</th><th>Статус</th></tr></thead>
    <tbody>`;

  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth() + 1;
  const currentDay = today.getDate();

  for (let m = 1; m <= 12; m++) {
    let isFuture = false;
    if (selectedYear > currentYear) isFuture = true;
    else if (selectedYear === currentYear) {
      if (m > currentMonth) isFuture = true;
      else if (m === currentMonth && currentDay < 12) isFuture = true;
    }

    const mPayments = yearPayments.filter(p => p.month === m);
    let mDebt = 0;
    mPayments.forEach(p => mDebt += (p.amount_due - p.amount_paid));
    
    const isPaid = mDebt <= 0 && mPayments.length > 0;
    const isEmpty = mPayments.length === 0;
    
    let statusText = 'Есть долг';
    let statusClass = 'status-unpaid';
    let rowClass = 'clickable-row';
    let onClickAction = `onclick="navigateTo('month', ${apt.id}, ${selectedYear}, ${m})"`;

    if (isEmpty && !isFuture) { statusText = 'Нет начислений'; statusClass = ''; } 
    else if (isPaid) { statusText = 'Оплачено'; statusClass = 'status-paid'; }

    if (isFuture) {
      statusText = 'Не наступил'; statusClass = ''; rowClass = 'disabled-row';
      onClickAction = `onclick="alert('Платежи откроются 12-го числа.')"`;
    }

    html += `
      <tr class="${rowClass}" ${onClickAction}>
        <td><b>${MONTH_NAMES[m-1]}</b></td>
        <td class="${mDebt > 0 && !isFuture ? 'debt-text' : ''}">${mDebt > 0 && !isFuture ? mDebt.toFixed(2) + ' ₽' : '-'}</td>
        <td class="${statusClass}">${statusText}</td>
      </tr>
    `;
  }
  html += `</tbody></table>`;
  area.innerHTML = html;
}

function renderMonthDetails(area) {
  const apt = currentApartments.find(a => a.id === selectedAptId);
  const mPayments = allPayments.filter(p => p.project_id === selectedAptId && p.year === selectedYear && p.month === selectedMonth);

  let html = `
    <div class="page-header">
      <h2>${apt.name} — ${MONTH_NAMES[selectedMonth-1]} ${selectedYear}</h2>
      <button class="btn-back" style="margin:0;" onclick="navigateTo('year', ${apt.id}, ${selectedYear})">← Назад</button>
    </div>
    
    <div class="add-form-container">
      <button onclick="toggleAddForm()" style="width:auto;">+ Добавить услугу</button>
      <div id="add-form-wrapper" class="form-hidden">
        <form id="add-payment-form" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: end; margin-top:10px;">
          <div>
            <label style="font-size: 12px; color: var(--muted);">Услуга</label>
            <select name="service" style="width: 100%; padding: 8px;" required>
              ${SERVICES_LIST.map(s => `<option value="${s.val}">${s.label}</option>`).join('')}
            </select>
          </div>
          <div>
            <label style="font-size: 12px; color: var(--muted);">Объем</label>
            <input name="volume" type="number" step="0.01" placeholder="0" style="margin: 0;">
          </div>
          <div>
            <label style="font-size: 12px; color: var(--muted);">Тариф</label>
            <input name="tariff" type="number" step="0.01" placeholder="0.00" style="margin: 0;">
          </div>
          <div>
            <label style="font-size: 12px; color: var(--muted);">Начислено (₽)</label>
            <input name="amount_due" type="number" step="0.01" placeholder="0.00" required style="margin: 0;">
          </div>
          <button type="submit" style="height: 38px;">OK</button>
        </form>
      </div>
    </div>
  `;

  if (mPayments.length === 0) {
    html += `<div class="empty-msg">В этом месяце пока нет начислений.</div>`;
  } else {
    html += `<table class="list-table">
      <thead><tr><th>Услуга</th><th>Объем</th><th>Тариф</th><th>Начислено</th><th>Оплачено</th><th>Долг</th><th style="text-align:right;">Действия</th></tr></thead>
      <tbody>`;
    
    mPayments.forEach(p => {
      if (editingPaymentId === p.id) {
        html += `<tr class="edit-row"><td colspan="7">Форма редактирования в разработке...</td></tr>`;
      } else {
        const debt = p.amount_due - p.amount_paid;
        const serviceName = SERVICES_LIST.find(s => s.val === p.service)?.label || p.service;
        
        html += `
          <tr>
            <td><b>${serviceName}</b></td>
            <td>${p.volume || '-'}</td>
            <td>${p.tariff || '-'}</td>
            <td>${p.amount_due} ₽</td>
            <td>${p.amount_paid} ₽</td>
            <td class="${debt > 0 ? 'debt-text' : 'debt-zero'}">${debt.toFixed(2)} ₽</td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn-icon edit" title="Редактировать" onclick="alert('Ред. в разработке')">✏️</button>
              <button class="btn-icon delete" title="Удалить" onclick="deletePayment(${p.id})">❌</button>
            </td>
          </tr>
        `;
      }
    });
    html += `</tbody></table>`;
  }

  area.innerHTML = html;

  $("#add-payment-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = Object.fromEntries(fd);
    payload.project_id = selectedAptId;
    payload.year = selectedYear;
    payload.month = selectedMonth;
    payload.amount_due = Number(payload.amount_due);
    payload.amount_paid = 0; // по умолчанию
    // В БД сейчас нет полей volume и tariff, мы их пока просто игнорируем
    // или нужно будет добавить в модель Payment (в app/models.py)
    
    await api("/payments/", { method: "POST", body: JSON.stringify(payload) });
    allPayments = await api("/payments/");
    renderContent(); 
  });
}

function toggleAddForm() {
  const wrapper = $("#add-form-wrapper");
  if (wrapper.classList.contains("form-hidden")) wrapper.classList.remove("form-hidden");
  else wrapper.classList.add("form-hidden");
}

async function deletePayment(id) {
  if (!confirm("Удалить эту услугу?")) return;
  await api(`/payments/${id}`, { method: "DELETE" });
  allPayments = await api("/payments/");
  renderContent();
}

async function deleteApartment(id) {
  if (!confirm("Удалить квартиру и все её платежи?")) return;
  await api(`/projects/${id}`, { method: "DELETE" });
  navigateTo('dashboard');
}

if (token()) enterApp();
