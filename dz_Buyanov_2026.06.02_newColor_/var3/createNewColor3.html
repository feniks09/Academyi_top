<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Color</title>
    <link rel="stylesheet" href="createNewColor3.css">
</head>
<body>
    <div class="container">
        <div class="fildInput">
            <h1>Create New Color</h1>
            <label for="nameColor">Название цвета</label>
            <br>
            <input id="nameColor" type="text" placeholder="Введите название">
            <br>
            <label for="typeColor">Тип цвета</label>
            <br>
            <select id="typeColor">
                <option value="RGB">RGB</option>
                <option value="RGBA">RGBA</option>
                <option value="HEX">HEX</option>
            </select>
            <br>
            <label for="indexColor">Индекс цвета</label>
            <br>
            <input id="indexColor" type="text" placeholder="154,205,50 или #FF4500"> 
            <br>
            <button id="saveButton">Save</button>
            <button id="clearAllButton">Clear All</button>
            <p class="nameOutput">All Colors</p>
        </div>
        
        <div class="exsemple-color_cart">
            <div class="cart-Color yellowgreen">
                <div class="info-Cart-Color yellowgreenlite">
                    <span>YELLOWGREEN</span>
                    <span>RGB</span>
                    <span>154,205,50</span>
                </div>
            </div>
            <div class="cart-Color darcaynas">
                <div class="info-Cart-Color darcaynaslite">
                    <span>DARCAYNAS</span>
                    <span>RGBA</span>
                    <span>0,139,139,1</span>
                </div>
            </div>
            <div class="cart-Color oranjered">
                <div class="info-Cart-Color oranjeredlite">
                    <span>ORANJERED</span>
                    <span>HEX</span>
                    <span>#FF4500</span>
                </div>
            </div>
        </div>

        <template id="templateCartColor">
            <div class="color-card">
                <div class="color-card-inner">
                    <span class="outputNameColor">Название</span>
                    <span class="outputTypeColor">Тип</span>
                    <span class="outputIndexColor">Значение</span>
                </div>
            </div>
        </template>

        <div id="output"></div>
    </div>    

    <script src="createNewColor3.js"></script>
</body>
</html>
