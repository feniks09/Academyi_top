<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание карточек цветов</title>
    <link rel="stylesheet" href="createNewColor_2.css">
</head>
<body>
    <div class="container">
        <h1>🎨 Создатель карточек цветов</h1>
        
        <div class="form-container">
            <h2>Введите данные</h2>
            <div class="form-group">
                <label for="nameColor">Название цвета:</label>
                <input type="text" id="nameColor" placeholder="Например: Красный" value="Красный">
            </div>
            <div class="form-group">
                <label for="typeColor">Тип цвета:</label>
                <input type="text" id="typeColor" placeholder="Например: Основной" value="Основной">
            </div>
            <div class="form-group">
                <label for="indexColor">Цвет (HEX/RGB/название):</label>
                <input type="text" id="indexColor" placeholder="#ff0000, red, rgb(255,0,0)" value="#ff0000">
            </div>
            <button id="saveButton" class="save-btn">➕ Создать карточку</button>
        </div>

        <div id="output" class="cards-container">
            <h2>Созданные карточки</h2>
        </div>
    </div>

    <!-- Шаблон карточки -->
    <template id="templateCartColor">
        <div class="cart-color">
            <div class="cart-content">
                <div class="cart-field">
                    <span class="label">Название:</span>
                    <span class="outputNameColor">Название</span>
                </div>
                <div class="cart-field">
                    <span class="label">Тип:</span>
                    <span class="outputTypeColor">Тип</span>
                </div>
                <div class="cart-field">
                    <span class="label">Код цвета:</span>
                    <span class="outputIndexColor">#000000</span>
                </div>
            </div>
            <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
        </div>
    </template>

    <script src="createNewColor_2.js"></script>
</body>
</html>
